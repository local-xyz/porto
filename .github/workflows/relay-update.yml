name: Update Relay

on:
  repository_dispatch:
    types: [relay-release]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-relay:
    name: Update Relay Version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Clone repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Set up Docker CLI
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Get latest Grid commit
        id: latest-grid
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GRID_COMMIT=$(gh api repos/local-xyz/grid/commits/main --jq .sha)
          echo "commit=$GRID_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Latest Grid commit: $GRID_COMMIT"

      - name: Run relay:up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRID_REF: ${{ steps.latest-grid.outputs.commit }}
        run: pnpm relay:up "$GRID_REF"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "No changes detected after running relay:up"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected after running relay:up"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            git diff --name-only
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # 271a8d0340265f705b14b6d32b9829c1cb33d45e
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          commit-message: 'chore: update Grid relay'
          body: |
            Pins the LocalXYZ Grid relay image built from `${{ steps.latest-grid.outputs.commit }}`.
            
            This PR was automatically created by the [`relay-update.yml`](.github/workflows/relay-update.yml) workflow.
          title: 'chore: update Grid relay'
          branch: chore/update-grid-relay
          delete-branch: true