name: Verify
on:
  workflow_call:

jobs:
  onramp:
    name: Onramp sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Check service types
        run: pnpm exec tsc --noEmit -p apps/service/tsconfig.json
      - name: Test sandbox authorization and checkout
        run: pnpm exec vitest run --config apps/service/vitest.config.ts

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Audit dependencies
        run: pnpm audit

      - name: Check code
        run: pnpm dlx @biomejs/biome check . --error-on-warnings

      - name: Check types
        run: |
          pnpm --filter ui prepare
          pnpm --filter ui build
          pnpm check:types

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build
        run: pnpm build

      - name: Check build
        run: pnpm check:build

      - name: Check for unused files, dependencies, and exports
        run: pnpm check:knip

      - name: Check size
        run: pnpm check:size

  test:
    name: Test
    uses: ./.github/workflows/test.yml
    secrets: inherit
